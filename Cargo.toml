[package]
name = "amsrust"
version = "0.1.1"
authors = ["Romain Giot <giot.romain@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
num = "0.4.0"
num_enum = "0.5.1"
itertools = "0.10.0"
cpclib = {path = "../rust.cpcdemotools/cpclib"}
cpclib-asm = {path = "../rust.cpcdemotools/cpclib-asm"}
cpclib-macros = {path = "../rust.cpcdemotools/cpclib-macros"}
cpclib-tokens = {path = "../rust.cpcdemotools/cpclib-tokens"}
cpclib-disc = {path = "../rust.cpcdemotools/cpclib-disc", default-features = false}
cpclib-csl = {path = "../rust.cpcdemotools/cpclib-csl"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
rand="0.8.3"
regex = "1.4.6"
lazy_static = "1.4.0"
array-init = "2.0.0"
delegate = "0.5.1"
#pixels = "0.3.0"
derive_more = "0.99.13"
image = "0.23.14"
tuple-map = "0.4.0"
smallvec = "1.6.1"
rustyline = "8.2.0" # Make not mandaotry
minifb = "0.28.0"
ym2149 = "0.9.1"

[patch.crates-io]
cpclib = {path = "../rust.cpcdemotools/cpclib/"}
cpclib-asm = {path = "../rust.cpcdemotools/cpclib-asm/"}
cpclib-basic = {path = "../rust.cpcdemotools/cpclib-basic/"}
cpclib-disc = {path = "../rust.cpcdemotools/cpclib-disc/"}
cpclib-macros = {path = "../rust.cpcdemotools/cpclib-macros/"}
cpclib-sna = {path = "../rust.cpcdemotools/cpclib-sna/"}#
cpclib-tokens = {path = "../rust.cpcdemotools/cpclib-tokens/"}
cpclib-xfer = {path = "../rust.cpcdemotools/cpclib-xfer/"}
cpclib-xfertool = {path = "../rust.cpcdemotools/cpclib-xfertool/"}
cpclib-z80emu = {path = "../rust.cpcdemotools/cpclib-z80emu/"}
