[package]
name = "amsrust"
version = "0.1.1"
authors = ["Romain Giot <giot.romain@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"], optional = true }
# Willy's sound cards: the OPL3 (OPL3LPT) and the General MIDI synth (S2P, from a SoundFont)
nuked-opl3 = { version = "0.1", optional = true }
rustysynth = { version = "1.3", optional = true }
# the M4's HTTP (|HTTPGET, |HTTPMEM): plain HTTP as the board, and HTTPS when a site redirects to it
ureq = { version = "2.12", default-features = false, features = ["tls", "native-certs", "proxy-from-env"], optional = true }
num = "0.4.0"
num_enum = "0.5.1"
itertools = "0.10.0"
cpclib-macros = {path = "../rust.cpcdemotools/cpclib-macros"}
cpclib-disc = {path = "../rust.cpcdemotools/cpclib-disc", default-features = false}
cpclib-csl = {path = "../rust.cpcdemotools/cpclib-csl"}
serde = {version = "1", features = ["derive"]}
serde_json = "1"
rand="0.8.3"
lazy_static = "1.4.0"
array-init = "2.0.0"
delegate = "0.5.1"
#pixels = "0.3.0"
derive_more = "0.99.13"
image = "0.23.14"
tuple-map = "0.4.0"
smallvec = "1.6.1"
ym2149 = "0.9.1"
bytemuck = { version = "1", optional = true, features = ["derive"] }
# disc images inside zip archives (--dsk file.zip, file.zip#name.dsk)
zip = { version = "2", default-features = false, features = ["deflate"] }

# The desktop: terminal monitor, debug server, windows, sound, and cpclib with its defaults.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpclib = {path = "../rust.cpcdemotools/cpclib"}
cpclib-asm = {path = "../rust.cpcdemotools/cpclib-asm"}
cpclib-tokens = {path = "../rust.cpcdemotools/cpclib-tokens"}
clap = { version = "4.5", features = ["derive", "wrap_help"] }
# HFE disc images, read and written by the HxC floppy library (a C library: desktop only)
hxcfe = { path = "../hxc_rust/hxcfe" }
rustyline = "8.2.0" # Make not mandaotry
minifb = "0.28.0"
cpal = { version = "0.18.2", optional = true }
ctrlc = { version = "3.5.2", features = ["termination"] }
tiny_http = "0.12"
# GPU CRT filter (`--features crt-gpu`), see src/display/gpu.rs
wgpu = { version = "27", optional = true, default-features = false, features = ["wgsl", "vulkan"] }
# `--frontend winit`: a window drawn by the GPU, see src/frontend/winit_gpu.rs
winit = { version = "0.30", optional = true }

# wgpu needs a native backend per OS; "vulkan" alone leaves macOS with none.
[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "27", optional = true, default-features = false, features = ["wgsl", "metal"] }

# A web page (see web/): no terminal, sockets, threads or native windows; the CRT on WebGPU.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpclib = {path = "../rust.cpcdemotools/cpclib", default-features = false}
cpclib-asm = {path = "../rust.cpcdemotools/cpclib-asm", default-features = false}
cpclib-tokens = {path = "../rust.cpcdemotools/cpclib-tokens", default-features = false}
wgpu = { version = "27", optional = true, default-features = false, features = ["wgsl", "webgpu"] }
getrandom = { version = "0.2", features = ["js"] }
# getrandom 0.3 also needs `getrandom_backend="wasm_js"`, see .cargo/config.toml
getrandom-03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[patch.crates-io]
cpclib = {path = "../rust.cpcdemotools/cpclib/"}
cpclib-asm = {path = "../rust.cpcdemotools/cpclib-asm/"}
cpclib-basic = {path = "../rust.cpcdemotools/cpclib-basic/"}
cpclib-disc = {path = "../rust.cpcdemotools/cpclib-disc/"}
cpclib-macros = {path = "../rust.cpcdemotools/cpclib-macros/"}
cpclib-sna = {path = "../rust.cpcdemotools/cpclib-sna/"}#
cpclib-tokens = {path = "../rust.cpcdemotools/cpclib-tokens/"}
cpclib-xfer = {path = "../rust.cpcdemotools/cpclib-xfer/"}
cpclib-xfertool = {path = "../rust.cpcdemotools/cpclib-xfertool/"}
cpclib-z80emu = {path = "../rust.cpcdemotools/cpclib-z80emu/"}
hxcfe = {path = "../hxc_rust/hxcfe"}
hxcfe-sys = {path = "../hxc_rust/hxcfe-sys"}

[profile.test]
# The tests run the emulator for whole frames, seconds of a CPC: unoptimised they took half an
# hour. Line tables only keep the backtraces' lines, without the size of full debug info.
opt-level = 1
debug = "line-tables-only"

# The dependencies without debug info: with it, each test and example binary is far bigger.
[profile.test.package."*"]
debug = false

[profile.release]
# The whole program optimised together: about 50% faster emulation than the default
# (crates optimised apart), for a longer build.
lto = "fat"
codegen-units = 1

[features]
default = ["audio", "playcity", "digiblaster", "m4", "m4-wifi", "albireo", "nova", "booster", "willy", "dandanator", "unidos", "orgams"]
# The extensions, each of which can be left out of a build:
# the PlayCity (two more AYs and a CTC, on the expansion port)
playcity = []
# the Digiblaster (a DAC on the printer port)
digiblaster = []
# the M4 board (its SD card a host folder; its ROM embedded)
m4 = []
# the M4's WiFi: sockets, DNS, HTTP on the host's network (not in a web page)
m4-wifi = ["m4", "dep:ureq"]
# the CPC Dandanator Mini (a 512K flash cartridge, commanded through trapped opcodes)
dandanator = []
# Willy (PulkoMandy's adapter for Serdaco's OPL3LPT and S2P)
willy = ["dep:nuked-opl3", "dep:rustysynth"]
# the Albireo (a CH376; its USB key a host folder or a FAT image)
albireo = ["dep:fatfs"]
# the Nova (NVRAM and a clock)
nova = []
# the CPC Booster+ and the MiniBooster (a UART, PWM sound, an ADC, EEPROM... on the expansion port)
booster = []
# the UniDOS ROMs and its nodes, embedded (inner://unidos...)
unidos = []
# the Orgams ROMs, embedded (inner://orgams...)
orgams = []
# Sound output in the `amsrust --window` binary (on Linux cpal needs the ALSA
# headers: libasound2-dev / alsa-lib-devel). On by default; a build without
# an audio system library uses `--no-default-features`.
audio = ["dep:cpal"]
# The CRT display filter on the GPU (wgpu), besides the CPU one.
crt-gpu = ["dep:wgpu", "dep:bytemuck"]
# A winit + wgpu window that shows the (CRT) picture without reading it back.
gpu-window = ["crt-gpu", "dep:winit"]
