# The web build (see web/): getrandom 0.3 takes its randomness from the browser, and the stack is
# 8 MB (the 1 MB default overflows when a CSL script rebuilds a machine: "memory access out of bounds").
[target.wasm32-unknown-unknown]
rustflags = ['--cfg', 'getrandom_backend="wasm_js"', '-C', 'link-arg=-zstack-size=8388608']
