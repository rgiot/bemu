[package]
name = "bemu-web"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The bemu Amstrad CPC emulator, to embed in a web page (see README.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amsrust = { path = "..", default-features = false, features = ["crt-gpu", "gui"] }
# the menu bar, the command palette and the debugger's windows (amsrust::ui), drawn over the picture
egui = "0.33"
image = "0.23.14"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "OffscreenCanvas", "OffscreenCanvasRenderingContext2d", "CanvasRenderingContext2d", "ImageData", "console"] }
wgpu = { version = "27", default-features = false, features = ["wgsl", "webgpu", "webgl"] }
console_error_panic_hook = "0.1"

[features]
# a headless speed measure for node, see src/bench.rs
bench = []
default = ["playcity", "digiblaster", "willy", "nova", "dandanator", "albireo"]
# the sound expansions a page can ask for (config playcity / digiblaster / willyOpl3)
playcity = ["amsrust/playcity"]
digiblaster = ["amsrust/digiblaster"]
willy = ["amsrust/willy"]
# the Nova (its NVRAM in memory) and the Dandanator (its romset uploaded, not written back)
nova = ["amsrust/nova"]
dandanator = ["amsrust/dandanator"]
# the Albireo, its USB key a FAT image uploaded (kept in memory)
albireo = ["amsrust/albireo"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic is reported by console_error_panic_hook, then the module stops
panic = "abort"
