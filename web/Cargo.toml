[package]
name = "bemu-web"
version = "0.1.0"
edition = "2021"
description = "The bemu Amstrad CPC emulator, to embed in a web page (see README.md)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
amsrust = { path = "..", default-features = false, features = ["crt-gpu"] }
image = "0.23.14"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "CanvasRenderingContext2d", "ImageData", "console"] }
wgpu = { version = "27", default-features = false, features = ["wgsl", "webgpu"] }
console_error_panic_hook = "0.1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# a panic is reported by console_error_panic_hook, then the module stops
panic = "abort"
