name: Build distributions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
            executable: amsrust
          - name: macos-arm64
            runner: macos-15
            executable: amsrust
          - name: windows-x86_64
            runner: windows-2022
            executable: amsrust.exe
    defaults:
      run:
        working-directory: bemu
    steps:
      - uses: actions/checkout@v4
        with:
          path: bemu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cpcsdk/rust.cpclib
          path: rust.cpcdemotools
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev libudev-dev libx11-dev libxkbcommon-dev libwayland-dev
      - name: Build
        run: cargo build --release --features gui
      - name: Prepare distribution
        shell: bash
        run: |
          mkdir dist
          cp "target/release/${{ matrix.executable }}" README.md NOTICE.md LICENSE-MIT LICENSE-APACHE LICENSE-GPL-3.0 third_party/licenses.json dist/
      - name: Archive Unix distribution
        if: runner.os != 'Windows'
        run: tar -czf "bemu-${{ matrix.name }}.tar.gz" -C dist .
      - name: Archive Windows distribution
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/* -DestinationPath "bemu-${{ matrix.name }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bemu-${{ matrix.name }}
          path: bemu/bemu-${{ matrix.name }}.*
          if-no-files-found: error

  web:
    name: Web
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bemu
    steps:
      - uses: actions/checkout@v4
        with:
          path: bemu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cpcsdk/rust.cpclib
          path: rust.cpcdemotools
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Binaryen
        # The official release, not the (older) apt package: wasm-opt must keep wasm-bindgen's externref table.
        run: |
          version=124
          curl -fsSL "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-x86_64-linux.tar.gz" \
            | sudo tar xz --strip-components=1 -C /usr/local
          wasm-opt --version
      - name: Install matching wasm-bindgen
        run: |
          cargo fetch --manifest-path web/Cargo.toml
          version=$(python3 -c 'import tomllib; packages = tomllib.load(open("web/Cargo.lock", "rb"))["package"]; versions = [p["version"] for p in packages if p["name"] == "wasm-bindgen"]; assert len(versions) == 1, versions; print(versions[0])')
          cargo install wasm-bindgen-cli --version "$version" --locked
      - name: Build web package
        run: web/build.sh
      - name: Smoke-test web package
        run: |
          node web/tests/check-externref-table.mjs web/pkg/bemu_web_bg.wasm
          node web/tests/smoke-init.mjs
      - name: Prepare distribution
        run: |
          mkdir -p dist
          cp -R web/pkg web/demo dist/
          cp web/README.md NOTICE.md LICENSE-MIT LICENSE-APACHE third_party/licenses.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: bemu-web
          path: bemu/dist/
          if-no-files-found: error

  # third_party/licenses.json (Help > Third-party licences, NOTICE.md) lists what the builds link:
  # it must follow the dependencies (tools/licenses.py writes it)
  licenses:
    name: Third-party licences
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bemu
    steps:
      - uses: actions/checkout@v4
        with:
          path: bemu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cpcsdk/rust.cpclib
          path: rust.cpcdemotools
          submodules: recursive
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the inventory
        run: python3 tools/licenses.py --check

  android:
    name: Android (bemu-droid)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bemu
    env:
      # the release APK's key (optional): a base64 keystore and its passwords as secrets, else the
      # debug key signs it
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: bemu
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cpcsdk/rust.cpclib
          path: rust.cpcdemotools
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # its own default packages include `tools`, which the SDK no longer has: ours instead
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - uses: gradle/actions/setup-gradle@v4
      - name: Release key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build the APKs
        working-directory: bemu/bemu-droid
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # the NDK installed above, not a newer one of the runner's image
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease bundleRelease
      - name: Test the machine on the host
        working-directory: bemu/bemu-droid/rust
        run: cargo test --release --no-default-features
      - name: Prepare distribution
        run: |
          mkdir -p dist
          apk=bemu-droid/app/build/outputs/apk
          cp $apk/debug/app-universal-debug.apk dist/bemu-droid-debug.apk
          cp $apk/release/app-universal-release.apk dist/bemu-droid.apk
          cp $apk/release/app-arm64-v8a-release.apk dist/bemu-droid-arm64.apk
          cp bemu-droid/app/build/outputs/bundle/release/app-release.aab dist/bemu-droid.aab
      - uses: actions/upload-artifact@v4
        with:
          name: bemu-android
          path: |
            bemu/dist/*.apk
            bemu/dist/*.aab
          if-no-files-found: error

  # The app run on an Android emulator: a disc opened and started by itself, both orientations,
  # the background and back, no crash (bemu-droid/tests/smoke.sh). The emulator draws with GLES:
  # the raw picture; the CTM (Vulkan) needs a phone.
  android-smoke:
    name: Android emulator smoke test
    needs: android
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bemu
    steps:
      - uses: actions/checkout@v4
        with:
          path: bemu
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bemu-android
          path: bemu/dist
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: bemu
          script: bemu-droid/tests/smoke.sh dist/bemu-droid-debug.apk validation/Benediction/bnd4_package.dsk smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bemu-android-smoke
          path: bemu/smoke/
          if-no-files-found: warn

  # Make the distributions available on the GitHub release page:
  # - a push on master refreshes the "latest" development pre-release
  # - a v* tag publishes a release for that tag
  release:
    name: Publish release
    needs: [desktop, web, android]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: write
    steps:
      - name: Download desktop distributions
        uses: actions/download-artifact@v4
        with:
          pattern: bemu-*-*
          path: release
          merge-multiple: true
      - name: Download web distribution
        uses: actions/download-artifact@v4
        with:
          name: bemu-web
          path: web-dist
      - name: Download Android distribution
        uses: actions/download-artifact@v4
        with:
          name: bemu-android
          path: release
      - name: Archive web distribution
        run: |
          cd web-dist
          zip -r ../release/bemu-web.zip .
      - name: List release files
        run: ls -l release
      - name: Publish development build
        if: github.ref == 'refs/heads/master'
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          prerelease: true
          draft: false
          tag: latest
          commit: ${{ github.sha }}
          name: Development Build
          generateReleaseNotes: false
          artifacts: release/*
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          replacesArtifacts: true
          prerelease: false
          draft: false
          generateReleaseNotes: true
          artifacts: release/*
